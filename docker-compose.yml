services:
  nginx:
    build:
      context: .
      target: final
    ports:
      - "80:80"
    depends_on:
      - admin
      - web-mcp
    restart: unless-stopped

  admin:
    build:
      context: .
      target: admin
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - EMINO_BLOG_DIR=/app
    volumes:
      - blog_content:/app/content
      - blog_static:/app/static
    restart: unless-stopped

  web-mcp:
    build:
      context: .
      target: web-mcp
    environment:
      - WEB_MCP_ROOT=/site
      - WEB_MCP_TOKEN=${WEB_MCP_TOKEN:-}
    volumes:
      - ./:/site
    restart: unless-stopped

volumes:
  blog_content:
  blog_static:
